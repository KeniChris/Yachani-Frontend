@if (abierto()) {
  <section class="panel" role="dialog" aria-labelledby="asistente-titulo">
    <header class="panel-header">
      <mat-icon fontSet="material-symbols-rounded" class="chispa" aria-hidden="true">auto_awesome</mat-icon>
      <h2 id="asistente-titulo">Asistente IA</h2>
      <button mat-icon-button type="button" (click)="minimizar()" aria-label="Minimizar asistente">
        <mat-icon fontSet="material-symbols-rounded">remove</mat-icon>
      </button>
      <button mat-icon-button type="button" (click)="cerrar()" aria-label="Cerrar asistente">
        <mat-icon fontSet="material-symbols-rounded">close</mat-icon>
      </button>
    </header>

    <div class="mensajes" #lista aria-live="polite">
      <p class="mensaje">{{ saludo() }}</p>
      @for (mensaje of mensajes(); track $index) {
        <p
          class="mensaje"
          [class.propio]="mensaje.rol === 'USUARIO'"
          [class.error]="mensaje.error"
        >
          {{ mensaje.texto }}
        </p>
      }
      @if (pensando()) {
        <p class="pensando" role="status">
          <span class="puntos" aria-hidden="true"><i></i><i></i><i></i></span>
          Pensando…
        </p>
      }
    </div>

    <form class="composer" (submit)="$event.preventDefault(); enviar()" aria-label="Escribir al asistente">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <input
          #campoPedido
          matInput
          [formControl]="pedido"
          maxlength="500"
          placeholder="Ej.: Mejora mi descripción de grupo"
          aria-label="Mensaje para el asistente"
        />
      </mat-form-field>
      <button
        mat-flat-button
        type="submit"
        class="send"
        [disabled]="!puedeEnviar()"
        aria-label="Enviar al asistente"
      >
        <mat-icon fontSet="material-symbols-rounded">send</mat-icon>
      </button>
    </form>
  </section>
} @else {
  <button mat-flat-button type="button" class="fab" (click)="abrir()">
    <mat-icon fontSet="material-symbols-rounded">auto_awesome</mat-icon>
    Asistente IA
  </button>
}
